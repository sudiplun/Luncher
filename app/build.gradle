apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "app.luncher"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 34
        versionName "v1.6.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Strip unused library locales from resources.arsc
        resourceConfigurations += [
            "en", "ne",
            "af-rZA", "ar-rSA", "ca-rES", "cs-rCZ", "da-rDK", "de-rDE",
            "el-rGR", "en-rUS", "es-rES", "et-rEE", "fa-rIR", "fi-rFI",
            "fr-rFR", "hr-rHR", "hu-rHU", "in-rID", "it-rIT", "iw-rIL",
            "ja-rJP", "ko-rKR", "lt-rLT", "nl-rNL", "no-rNO", "pl-rPL",
            "pt-rBR", "pt-rPT", "ro-rRO", "ru-rRU", "sr-rSP", "sv-rSE",
            "th-rTH", "tr-rTR", "uk-rUA", "vi-rVN", "zh-rCN", "zh-rTW"
        ]
    }

    buildFeatures {
        compose true
        viewBinding = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += [
                "kotlin/**",
                "META-INF/*.version",
                "META-INF/CHANGES",
                "META-INF/README.md",
                "DebugProbesKt.bin"
            ]
        }
    }

    def releaseFile = rootProject.file("release.properties")
    def properties = new Properties()
    if (releaseFile.exists()) {
        releaseFile.withInputStream { properties.load(it) }
    }

    signingConfigs {
        release {
            if (releaseFile.exists()) {
                storeFile rootProject.file(properties['storeFile'])
                storePassword properties['storePassword']
                keyAlias properties['keyAlias']
                keyPassword properties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
    namespace 'app.olaunchercf'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation "androidx.recyclerview:recyclerview:1.2.1"

    // Android lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.5.3"

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // JETPACK
    // Integration with activities
    implementation 'androidx.activity:activity-compose:1.6.1'
    // Compose foundation (UI runtime and layout)
    implementation 'androidx.compose.foundation:foundation:1.2.0'


    testImplementation 'junit:junit:4.13.2'

    def androidx_test_espresso = "3.5.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidx_test_espresso"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$androidx_test_espresso"
    androidTestImplementation "androidx.test.espresso:espresso-idling-resource:$androidx_test_espresso"


    // Test rules and transitive dependencies:
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.3.2")
    // Needed for createComposeRule, but not createAndroidComposeRule:
    debugImplementation("androidx.compose.ui:ui-test-manifest:1.3.2")
    androidTestImplementation("androidx.navigation:navigation-testing:2.5.3")
    debugImplementation("androidx.fragment:fragment-testing:1.5.5")
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.0')
    androidTestImplementation('androidx.test:runner:1.5.1')
    androidTestImplementation('androidx.test:rules:1.5.0')
}
