name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APKs and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for var in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Missing one or more required GitHub Actions secrets: RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD."
            exit 1
          fi

      - name: Prepare release signing config
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("app/release.jks").write_bytes(base64.b64decode(os.environ["KEYSTORE_B64"]))

          def escape_prop(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")

          lines = [
              "storeFile=app/release.jks",
              f"storePassword={escape_prop(os.environ['STORE_PASSWORD'])}",
              f"keyAlias={escape_prop(os.environ['KEY_ALIAS'])}",
              f"keyPassword={escape_prop(os.environ['KEY_PASSWORD'])}",
          ]
          Path("release.properties").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and build signed release APKs
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Clean up signing material
        if: always()
        run: rm -f release.properties app/release.jks

      - name: Stage release APK assets
        run: |
          mkdir -p release-assets
          tag="${GITHUB_REF_NAME}"
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            if [[ "$base" == *"-unsigned.apk" ]]; then
              echo "::error::Refusing to publish unsigned APK: $base"
              exit 1
            fi
            abi="${base#app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "release-assets/Luncher-${tag}-${abi}.apk"
          done
          ls -lh release-assets/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.apk
